name: EduFin (GradPilot) CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ci-checks:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint
        continue-on-error: true # Keep going even if there are lint warnings to avoid blocking development, though standard matches should ideally pass.

      - name: Run Type Checks
        run: npx tsc --noEmit

      - name: Run Tests
        run: npm run test:run

