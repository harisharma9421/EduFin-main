# SonarQube project config for GradPilot.
# Used by `sonar-scanner` either in CI (Jenkins) or locally:
#   sonar-scanner -Dsonar.host.url=http://localhost:9000 -Dsonar.login=$SONAR_TOKEN

sonar.projectKey=gradpilot
sonar.projectName=GradPilot
sonar.sources=src
sonar.sourceEncoding=UTF-8

# Things that aren't our code or are already minified.
sonar.exclusions=**/node_modules/**,**/.next/**,**/extension/dist/**,**/public/**,**/scripts/**,**/*.css,**/*.svg

# TypeScript + Next.js project layout.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json
